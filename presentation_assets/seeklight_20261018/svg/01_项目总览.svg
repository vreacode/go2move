nejoin="round"/><circle cx="-61" cy="28" r="12" fill="#5E718C"/><circle cx="42" cy="29" r="12" fill="#5E718C"/><text x="-27" y="18" font-family="Noto Sans CJK SC" font-size="22" font-weight="600" text-anchor="start" fill="#566981">Go2</text></g><rect x="1221" y="880" width="274" height="37" rx="18" fill="#EAF2FF"/><text x="1358.0" y="905" font-family="Noto Sans CJK SC" font-size="20" font-weight="500" text-anchor="middle" fill="#2563EB">Go2 · 场景化演示方案</text></svg>