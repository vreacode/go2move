<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>寻光搭子：Go2 寻人系统设计示意</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F8FD"/><rect x="0" y="0" width="1920" height="12" rx="0" fill="#2563EB"/><text x="80" y="68" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" text-anchor="start" fill="#2563EB">SEEKLIGHT  /  GO2</text><text x="80" y="130" font-family="Noto Sans CJK SC" font-size="44" font-weight="700" text-anchor="start" fill="#12223D">寻光搭子</text><text x="80" y="177" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" text-anchor="start" fill="#536882">语言驱动的校园主动寻人机器狗</text><path d="M 80 1017 L 1840 1017" fill="none" stroke="#DCE5F1" stroke-width="2" stroke-linecap="round"/><text x="80" y="1050" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" text-anchor="start" fill="#536882">方案与界面设计示意 · 含待联调及待实机验收功能</text><text x="1838" y="1050" font-family="Noto Sans CJK SC" font-size="20" font-weight="600" text-anchor="end" fill="#2563EB">01</text><text x="85" y="320" font-family="Noto Sans CJK SC" font-size="75" font-weight="700" text-anchor="start" fill="#12223D">一句话，</text><text x="85" y="422" font-family="Noto Sans CJK SC" font-size="75" font-weight="700" text-anchor="start" fill="#2563EB">帮你找到 TA。</text><text x="88" y="494" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" text-anchor="start" fill="#536882">拍照指定目标，前往区域搜索。</text><text x="88" y="538" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" text-anchor="start" fill="#536882">停步观察、复核候选、播报并记录。</text><rect x="88" y="612" width="173" height="37" rx="18" fill="#EAF2FF"/><text x="174.5" y="637" font-family="Noto Sans CJK SC" font-size="21" font-weight="500" text-anchor="middle" fill="#2563EB">多模态任务</text><rect x="278" y="612" width="151" height="37" rx="18" fill="#EAF2FF"/><text x="353.5" y="637" font-family="Noto Sans CJK SC" font-size="21" font-weight="500" text-anchor="middle" fill="#2563EB">地图导航</text><rect x="446" y="612" width="151" height="37" rx="18" fill="#EAF2FF"/><text x="521.5" y="637" font-family="Noto Sans CJK SC" font-size="21" font-weight="500" text-anchor="middle" fill="#2563EB">视觉寻人</text><rect x="614" y="612" width="151" height="37" rx="18" fill="#EAF2FF"/><text x="689.5" y="637" font-family="Noto Sans CJK SC" font-size="21" font-weight="500" text-anchor="middle" fill="#2563EB">证据反馈</text><rect x="87" y="714" width="708" height="216" rx="24" fill="white" stroke="#DCE5F1" stroke-width="1"/><text x="116" y="757" font-family="Noto Sans CJK SC" font-size="21" font-weight="600" text-anchor="start" fill="#536882">一个完整任务</text><text x="116" y="808" font-family="Noto Sans CJK SC" font-size="32" font-weight="600" text-anchor="start" fill="#12223D">“去 A 区找照片里的人，</text><text x="116" y="856" font-family="Noto Sans CJK SC" font-size="32" font-weight="600" text-anchor="start" fill="#12223D">  找到后告诉我。”</text><rect x="898" y="244" width="936" height="687" rx="32" fill="white" stroke="#DCE5F1" stroke-width="1"/><rect x="930" y="278" width="870" height="362" rx="16" fill="#F1F5FA"/><g transform="translate(930 278) scale(2.5588235294117645 1.5739130434782609)"><rect x="18" y="18" width="110" height="72" rx="6" fill="#D5DFEB"/><path d="M 30 32 L 116 32" fill="none" stroke="#B4C3D6" stroke-width="3" stroke-linecap="round"/><rect x="202" y="18" width="118" height="72" rx="6" fill="#D5DFEB"/><path d="M 214 32 L 308 32" fill="none" stroke="#B4C3D6" stroke-width="3" stroke-linecap="round"/><rect x="18" y="153" width="110" height="59" rx="6" fill="#D5DFEB"/><path d="M 30 167 L 116 167" fill="none" stroke="#B4C3D6" stroke-width="3" stroke-linecap="round"/><rect x="202" y="153" width="118" height="59" rx="6" fill="#D5DFEB"/><path d="M 214 167 L 308 167" fill="none" stroke="#B4C3D6" stroke-width="3" stroke-linecap="round"/><path d="M46 126 L164 126 L164 114 L276 114" stroke="#7EA4EF" stroke-width="18" stroke-linecap="round" fill="none" opacity=".22"/><path d="M