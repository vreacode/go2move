<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>寻光搭子：Go2 寻人系统设计示意</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F8FD"/><rect x="0" y="0" width="1920" height="12" rx="0" fill="#2563EB"/><text x="80" y="68" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" text-anchor="start" fill="#2563EB">SEEKLIGHT  /  GO2</text><text x="80" y="130" font-family="Noto Sans CJK SC" font-size="44" font-weight="700" text-anchor="start" fill="#12223D">从任务理解，到可执行的机器狗技能</text><text x="80" y="177" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" text-anchor="start" fill="#536882">语义规划与实时执行分层；地图、观测和任务记录构成反馈</text><path d="M 80 1017 L 1840 1017" fill="none" stroke="#DCE5F1" stroke-width="2" stroke-linecap="round"/><text x="80" y="1050" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" text-anchor="start" fill="#536882">方案与界面设计示意 · 含待联调及待实机验收功能</text><text x="1838" y="1050" font-family="Noto Sans CJK SC" font-size="20" font-weight="600" text-anchor="end" fill="#2563EB">03</text><text x="80" y="255" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="start" fill="#12223D">用户与前端</text><text x="80" y="290" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">说清需求</text><text x="532" y="255" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="start" fill="#12223D">任务理解与计划</text><text x="532" y="290" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">生成受限任务</text><text x="984" y="255" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="start" fill="#12223D">NX 本地执行</text><text x="984" y="290" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">按观测采取行动</text><text x="1436" y="255" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="start" fill="#12223D">结果与反馈</text><text x="1436" y="290" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">把证据交给用户</text><rect x="80" y="326" width="374" height="186" rx="20" fill="white" stroke="#DCE5F1" stroke-width="2"/><text x="104" y="369" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#12223D">多模态入口</text><text x="104" y="411" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">拍照 / 语音 / 文字</text><text x="104" y="444" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">搜索区域与目标条件</text><rect x="80" y="539" width="374" height="176" rx="20" fill="white" stroke="#DCE5F1" stroke-width="2"/><text x="104" y="582" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#12223D">任务操作</text><text x="104" y="624" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">预览、确认、开始</text><text x="104" y="657" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">暂停、取消、查看记录</text><rect x="532" y="326" width="374" height="186" rx="20" fill="white" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 6"/><text x="556" y="369" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#2563EB">任务解析与工具选择</text><text x="556" y="411" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">结构化目标、区域与步骤</text><text x="556" y="444" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">大模型能力待接入</text><text x="556" y="477" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">视觉问答与澄清（规划）</text><rect x="532" y="539" width="374" height="176" rx="20" fill="white" stroke="#DCE5F1" stroke-width="2"/><text x="556" y="582" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#12223D">任务状态管理</text><text x="556" y="624" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">到点 → 观察 → 复核</text><text x="556" y="657" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">超时、取消与结果回执</text><rect x="984" y="326" width="374" height="186" rx="20" fill="white" stroke="#2563EB" stroke-width="2" stroke-dasharray="8 6"/><text x="1008" y="369" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#2563EB">导航与障碍处理</text><text x="1008" y="411" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">地图定位与观察点导航</text><text x="1008" y="444" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">受限执行 · 待实机验收</text><rect x="984" y="539" width="374" height="176" rx="20" fill="white" stroke="#DCE5F1" stroke-width="2"/><text x="1008" y="582" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#12223D">感知与身份复核</text><text x="1008" y="624" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">图像检测 / 短时跟踪</text><text x="1008" y="657" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">参考照片匹配 / 多帧确认</text><rect x="1436" y="326" width="374" height="186" rx="20" fill="white" stroke="#DCE5F1" stroke-width="2"/><text x="1460" y="369" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#12223D">现场反馈</text><text x="1460" y="411" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">候选照片与观察点</text><text x="1460" y="444" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">发现提示与人工确认</text><rect x="1436" y="539" width="374" height="176" rx="20" fill="white" stroke="#DCE5F1" stroke-width="2"/><text x="1460" y="582" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#12223D">任务证据</text><text x="1460" y="624" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">搜索轨迹、时间与状态</text><text x="1460" y="657" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">发现记录与确认结果</text><path d="M 463 420 L 515 420" fill="none" stroke="#2563EB" stroke-width="3"/><polygon points="515,420 504.1946347717679,425.21958640933474 504.1946347717679,414.78041359066526" fill="#2563EB"/><path d="M 915 420 L 967 420" fill="none" stroke="#2563EB" stroke-width="3"/><polygon points="967,420 956.1946347717678,425.21958640933474 956.1946347717678,414.78041359066526" fill="#2563EB"/><path d="M 1367 420 L 1419 420" fill="none" stroke="#2563EB" stroke-width="3"/><polygon points="1419,420 1408.1946347717678,425.21958640933474 1408.1946347717678,414.78041359066526" fill="#2563EB"/><rect x="80" y="791" width="1730" height="153" rx="22" fill="#EAF2FF"/><text x="114" y="837" font-family="Noto Sans CJK SC" font-size="26" font-weight="700" text-anchor="start" fill="#2563EB">共享地图与任务记忆</text><text x="114" y="883" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" text-anchor="start" fill="#536882">已保存地图  /  区域与观察点  /  目标照片  /  历史发现  /  任务事件</text><path d="M 1624 723 L 1624 775" fill="none" stroke="#0F766E" stroke-width="3"/><polygon points="1624,775 1618.7804135906651,764.1946347717678 1629.2195864093349,764.1946347717678" fill="#0F766E"/><path d="M 720 776 L 720 727" fill="none" stroke="#0F766E" stroke-width="3"/><polygon points="720,727 725.2195864093347,737.8053652282322 714.7804135906653,737.8053652282322" fill="#0F766E"/><text x="1290" y="981" font-family="Noto Sans CJK SC" font-size="19" font-weight="400" text-anchor="start" fill="#536882">虚线框：待接入或待实机验收模块</text></svg>