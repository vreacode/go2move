4" height="24" rx="7" fill="#334155"/><ellipse cx="-2" cy="-43" rx="22" ry="7" fill="#52637B"/><path d="M-61 28 L-84 76 L-38 104 L-47 133 M42 29 L70 77 L27 104 L36 133" fill="none" stroke="#34445D" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-61" cy="28" r="12" fill="#5E718C"/><circle cx="42" cy="29" r="12" fill="#5E718C"/><text x="-27" y="18" font-family="Noto Sans CJK SC" font-size="22" font-weight="600" text-anchor="start" fill="#566981">Go2</text></g><path d="M726 484 L1018 351 L1053 538 Z" fill="#D6E6FF"/><g opacity=".32"><g transform="translate(995 402) scale(0.68)"><circle cx="0" cy="0" r="18" fill="#EDCDB7"/><path d="M-18 -3 Q-19 -27 3 -23 Q21 -22 18 -1 L13 -9 Q-3 -7 -10 -14 Z" fill="#26354D"/><path d="M-20 25 Q0 13 20 25 L32 84 L17 88 L9 55 L12 106 L-12 106 L-9 55 L-17 88 L-32 84 Z" fill="#DE654E"/><path d="M-12 102 L-14 165 L-2 165 L0 116 L4 165 L17 165 L12 102 Z" fill="#334155"/><rect x="-17" y="161" width="18" height="7" rx="3" fill="#1E293B"/><rect x="3" y="161" width="18" height="7" rx="3" fill="#1E293B"/></g></g><text x="995" y="386" font-family="Noto Sans CJK SC" font-size="25" font-weight="700" text-anchor="middle" fill="#B77918">?</text><text x="624" y="352" font-family="Noto Sans CJK SC" font-size="18" font-weight="600" text-anchor="start" fill="#536882">可观测区域</text><text x="112" y="608" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#2563EB">被遮挡时未检出</text><text x="112" y="648" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" text-anchor="start" fill="#536882">结合记忆，保留障碍风险</text><text x="606" y="608" font-family="Noto Sans CJK SC" font-size="26" font-weight="650" text-anchor="start" fill="#0F766E">可见区域持续未检出</text><text x="606" y="648" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" text-anchor="start" fill="#536882">结合观测可靠性，更新风险</text><rect x="1151" y="239" width="660" height="481" rx="25" fill="#EAF2FF"/><text x="1184" y="292" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" text-anchor="start" fill="#2563EB">拟研究的方法链路</text><rect x="1182" y="319" width="596" height="98" rx="17" fill="white"/><text x="1205" y="356" font-family="Noto Sans CJK SC" font-size="25" font-weight="650" text-anchor="start" fill="#12223D">观测可靠性</text><text x="1205" y="391" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">距离、稀疏程度、遮挡与运动状态</text><path d="M 1480 420 L 1480 435" fill="none" stroke="#2563EB" stroke-width="2"/><polygon points="1480,435 1474.7804135906651,424.1946347717679 1485.2195864093349,424.1946347717679" fill="#2563EB"/><rect x="1182" y="440" width="596" height="98" rx="17" fill="white"/><text x="1205" y="477" font-family="Noto Sans CJK SC" font-size="25" font-weight="650" text-anchor="start" fill="#12223D">障碍存在与预测风险</text><text x="1205" y="512" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">有观测 / 无观测时的条件概率更新</text><path d="M 1480 541 L 1480 556" fill="none" stroke="#2563EB" stroke-width="2"/><polygon points="1480,556 1474.7804135906651,545.1946347717678 1485.2195864093349,545.1946347717678" fill="#2563EB"/><rect x="1182" y="561" width="596" height="98" rx="17" fill="white"/><text x="1205" y="598" font-family="Noto Sans CJK SC" font-size="25" font-weight="650" text-anchor="start" fill="#12223D">导航行为约束</text><text x="1205" y="633" font-family="Noto Sans CJK SC" font-size="21" font-weight="400" text-anchor="start" fill="#536882">依据风险选择速度、等待或绕行</text><text x="82" y="780" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" text-anchor="start" fill="#12223D">用统一条件的对照与消融，验证方法价值</text><rect x="80" y="814" width="407" height="126" rx="20" fill="white" stroke="#DCE5F1" stroke-width="1"/><text x="105" y="858" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" text-anchor="start" fill="#536882">评价指标</text><text x="105" y="905" font-family="Noto Sans CJK SC" font-size="29" font-weight="650" text-anchor="start" fill="#12223D">安全边界侵犯</text><rect x="521" y="814" width="407" height="126" rx="20" fill="white" stroke="#DCE5F1" stroke-width="1"/><text x="546" y="858" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" text-anchor="start" fill="#536882">评价指标</text><text x="546" y="905" font-family="Noto Sans CJK SC" font-size="29" font-weight="650" text-anchor="start" fill="#12223D">误停车次数</text><rect x="962" y="814" width="407" height="126" rx="20" fill="white" stroke="#DCE5F1" stroke-width="1"/><text x="987" y="858" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" text-anchor="start" fill="#536882">评价指标</text><text x="987" y="905" font-family="Noto Sans CJK SC" font-size="29" font-weight="650" text-anchor="start" fill="#12223D">任务完成时间</text><rect x="1403" y="814" width="407" height="126" rx="20" fill="white" stroke="#DCE5F1" stroke-width="1"/><text x="1428" y="858" font-family="Noto Sans CJK SC" font-size="17" font-weight="400" text-anchor="start" fill="#536882">评价指标</text><text x="1428" y="905" font-family="Noto Sans CJK SC" font-size="29" font-weight="650" text-anchor="start" fill="#12223D">运行延迟</text><text x="82" y="984" font-family="Noto Sans CJK SC" font-size="20" font-weight="400" text-anchor="start" fill="#536882">本页为研究设计示意，尚不代表已验证的算法创新或性能提升。</text></svg>