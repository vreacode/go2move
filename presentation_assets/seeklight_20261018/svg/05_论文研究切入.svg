<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>寻光搭子：Go2 寻人系统设计示意</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F8FD"/><rect x="0" y="0" width="1920" height="12" rx="0" fill="#2563EB"/><text x="80" y="68" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" text-anchor="start" fill="#2563EB">SEEKLIGHT  /  GO2</text><text x="80" y="130" font-family="Noto Sans CJK SC" font-size="44" font-weight="700" text-anchor="start" fill="#12223D">面向遮挡与间歇性漏检的风险导航</text><text x="80" y="177" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" text-anchor="start" fill="#536882">拟研究：区分“本应看见却没有检测到”与“被遮挡所以看不见”</text><path d="M 80 1017 L 1840 1017" fill="none" stroke="#DCE5F1" stroke-width="2" stroke-linecap="round"/><text x="80" y="1050" font-family="Noto Sans CJK SC" font-size="18" font-weight="400" text-anchor="start" fill="#536882">方案与界面设计示意 · 含待联调及待实机验收功能</text><text x="1838" y="1050" font-family="Noto Sans CJK SC" font-size="20" font-weight="600" text-anchor="end" fill="#2563EB">05</text><rect x="80" y="239" width="1028" height="481" rx="25" fill="white" stroke="#DCE5F1" stroke-width="1"/><text x="110" y="292" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" text-anchor="start" fill="#12223D">相同的“未检出”，可能意味着不同的风险</text><rect x="110" y="324" width="469" height="236" rx="18" fill="#F1F5FA"/><g transform="translate(184 482) scale(0.5)"><ellipse cx="5" cy="130" rx="145" ry="15" fill="#DFE7F1"/><path d="M-85 25 L-108 70 L-68 100 L-85 127 M65 25 L92 70 L58 100 L72 127" fill="none" stroke="#8395AC" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><rect x="-109" y="-19" width="213" height="66" rx="27" fill="#D5DDE8"/><rect x="-94" y="-13" width="180" height="37" rx="19" fill="#EDF2F7"/><rect x="71" y="-12" width="53" height="44" rx="15" fill="#27364C"/><rect x="100" y="-4" width="29" height="24" rx="8" fill="#152238"/><circle cx="114" cy="8" r="7" fill="#5DC2F5"/><r